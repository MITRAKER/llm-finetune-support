# Dependabot opens a pull request when a pinned dependency or a GitHub Action has
# a new version. CI tests it on the CPU and checks that the GPU pins still install
# together; an upgrade of a GPU-only package also needs a quick-test run on Kaggle.
version: 2
registries:
  # The demo app installs llama-cpp-python's prebuilt CPU wheels from this public
  # index (app/requirements.txt). Dependabot can only reach the package hosts that
  # are named here, so the index is declared even though it needs no password.
  llama-cpp-cpu-wheels:
    type: python-index
    url: https://abetlen.github.io/llama-cpp-python/whl/cpu
    replaces-base: false
updates:
  - package-ecosystem: pip
    directory: "/requirements"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns: ["mypy", "pip-audit", "pre-commit", "pytest*", "ruff", "types-*"]
    ignore:
      # The GPU training stack is capped by Unsloth (torch<2.15, transformers<=5.17.0,
      # trl<=1.15.0, datasets<5). Upgrade these by hand, together, when a new Unsloth
      # release supports newer versions. Patch releases are still proposed, except for
      # transformers and trl: Unsloth caps them at the exact versions pinned here.
      - dependency-name: accelerate
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: datasets
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: peft
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: torch
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: transformers
      - dependency-name: trl
      - dependency-name: unsloth
      - dependency-name: unsloth-zoo
      # transformers 5.17 and datasets 4.8 need huggingface-hub below 2, so a 2.x
      # release can only come with the next upgrade of the stack above.
      - dependency-name: huggingface-hub
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    # The demo app is not tied to the training stack: it runs huggingface-hub 2.x.
    directory: "/app"
    registries:
      - llama-cpp-cpu-wheels
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
