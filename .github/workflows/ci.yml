# Continuous integration: every push to main and every pull request must pass
# all of these jobs before it can be merged.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only need to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is now out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint, format, types, Power of Ten
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dev tools
        run: pip install -r requirements/dev.txt
      - name: Ruff lint (style, bugs, complexity, security rules)
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy type check
        run: mypy
      - name: Power of Ten rules (NASA/JPL, adapted to Python)
        run: python tools/check_power_of_ten.py src tools app tests
      - name: Pre-commit hooks (whitespace, file formats, private keys, clean notebooks)
        env:
          # ruff, mypy and the Power of Ten checker ran above, and gitleaks only checks
          # changes staged for a commit, so they are skipped here.
          SKIP: ruff-check,ruff-format,mypy,power-of-ten,gitleaks
        run: pre-commit run --all-files --show-diff-on-failure

  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Unit tests (no GPU stack needed)
        run: pytest -m "not slow"

  smoke:
    name: End-to-end smoke test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the training stack (CPU run of the same libraries)
        run: pip install -r requirements/smoke.txt
      - name: All tests, including a real training run of a tiny model, with coverage
        env:
          TRITON_INTERPRET: "1" # TRL's loss kernel is written in Triton; run it on the CPU
        run: pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=85
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      # pip-audit resolves each file with pip, so it also audits every indirect dependency.
      - name: Audit the pipeline and dev dependencies
        run: pip-audit --progress-spinner off -r requirements/dev.txt
      - name: Audit the training stack (CPU smoke test and GPU)
        # This also fails when the GPU pins cannot be installed together, for example after
        # a Dependabot bump above what Unsloth allows. datasets 4.8.5 and fsspec 2026.2.0
        # have advisories whose fixes Unsloth's datasets<5 cap blocks, and the pipeline does
        # not use the affected code. See SECURITY.md; remove the exceptions after upgrading.
        run: |
          pip-audit --progress-spinner off -r requirements/smoke.txt --ignore-vuln PYSEC-2026-3716 --ignore-vuln PYSEC-2026-4217
          pip-audit --progress-spinner off -r requirements/train.txt --ignore-vuln PYSEC-2026-3716 --ignore-vuln PYSEC-2026-4217
      - name: Audit the demo app dependencies
        # diskcache, pulled in by llama-cpp-python, has an advisory with no fixed version
        # yet (CVE-2025-69872: code execution for someone who can already write to the
        # cache folder). The app never uses llama-cpp-python's disk cache, so it is not
        # exposed. See SECURITY.md; remove the exception once a fix is released.
        run: pip-audit --progress-spinner off -r app/requirements.txt --ignore-vuln PYSEC-2026-2447
      - name: Audit the Gradio version the Space runs
        # The Space installs Gradio from sdk_version in app/README.md, not from a requirements
        # file, so Dependabot cannot see it: audit it here, and bump it by hand.
        run: |
          printf 'gradio==%s\n' "$(sed -n 's/^sdk_version: //p' app/README.md)" > "$RUNNER_TEMP/space-sdk.txt"
          pip-audit --progress-spinner off -r "$RUNNER_TEMP/space-sdk.txt"
