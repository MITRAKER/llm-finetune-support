# Checks that run on every `git commit` (install once with: pre-commit install).
# CI runs every hook too (except gitleaks, which checks staged changes), plus the tests,
# pip-audit and CodeQL. ruff, mypy and the Power of Ten checker run from your virtual
# environment (activate it before you commit), so they are the versions pinned in
# requirements/dev.txt, which CI uses and Dependabot updates. Update the other hooks'
# pinned versions with: pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files # keeps datasets and model weights out of git
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Notebook outputs can hold tokens, huge logs and personal paths: commit notebooks clean.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  # Blocks commits that contain API keys or tokens (HF_TOKEN, ANTHROPIC_API_KEY, ...).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.26.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff (format)
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: mypy
        name: mypy (type check)
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: power-of-ten
        name: Power of Ten rules (NASA/JPL, adapted to Python)
        entry: python tools/check_power_of_ten.py src tools app tests
        language: system
        types: [python]
        pass_filenames: false
